<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy RP Register</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════
     STAFF REGISTER VIEW
══════════════════════════════════════════════════ -->
<div id="view-register" class="view" style="display:none">
  <div class="panel reg-panel">
    <div class="panel-header">
      <div class="panel-header-left">
        <div class="panel-title"><svg class="fad" aria-hidden="true"><use href="#duotone-cash-register"></use></svg> REGISTER</div>
        <div class="panel-sub" id="reg-biz-label"></div>
      </div>
      <div class="panel-header-right">
        <div class="btn-icon-sm-wrap"><button class="btn-icon-sm" title="Manage Bundles" onclick="Register.openManagement()"><svg class="fad" aria-hidden="true"><use href="#duotone-gear"></use></svg></button></div>
        <div class="btn-icon-sm-wrap"><button class="btn-icon-sm btn-close-x" onclick="closeUI()"><svg class="fad" aria-hidden="true"><use href="#duotone-xmark"></use></svg></button></div>
      </div>
    </div>
    <div class="reg-body">

      <!-- LEFT: Bundle Grid -->
      <div class="reg-left">
        <div class="reg-search-row">
          <div class="search-wrap">
            <svg class="fad search-icon" aria-hidden="true"><use href="#duotone-magnifying-glass"></use></svg>
            <input id="reg-search" class="inp search-inp" type="text" placeholder="Search bundles…" oninput="Register.filter()">
          </div>
        </div>
        <div id="reg-bundles" class="reg-grid"></div>
      </div>

      <!-- RIGHT: Cart / Summary -->
      <div class="reg-right">
        <div class="cart-title">ORDER SUMMARY</div>
        <div id="terminal-status" class="terminal-status" style="display:none"></div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-footer">
          <div class="cart-total-row">
            <div class="cart-total-left">
              <span class="cart-total-label">TOTAL</span>
              <div id="cart-count" class="cart-count">0 bundles selected</div>
            </div>
            <span id="cart-total" class="cart-total-val">$0</span>
          </div>
          <button id="place-order-btn" class="btn-primary full-width" onclick="Register.placeOrder()" disabled>
            PLACE ORDER
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════
     MANAGEMENT VIEW
══════════════════════════════════════════════════ -->
<div id="view-management" class="view" style="display:none">
  <div class="panel mgmt-panel">
    <div class="panel-header">
      <div class="panel-header-left">
        <div class="panel-title"><svg class="fad" aria-hidden="true"><use href="#duotone-layer-group"></use></svg> BUNDLE <span class="accent">MANAGEMENT</span></div>
        <div class="panel-sub" id="mgmt-biz-label"></div>
      </div>
      <div class="panel-header-right">
        <div class="mgmt-header-btns">
          <button class="btn-mgmt-back" onclick="Management.back()"><svg class="fad" aria-hidden="true"><use href="#duotone-chevron-left"></use></svg> Back</button>
          <button class="btn-mgmt-new" onclick="Management.openModal()"><svg class="fad" aria-hidden="true"><use href="#duotone-folder-plus"></use></svg> New Bundle</button>
        </div>
        <div class="btn-icon-sm-wrap"><button class="btn-icon-sm btn-close-x" onclick="closeUI()"><svg class="fad" aria-hidden="true"><use href="#duotone-xmark"></use></svg></button></div>
      </div>
    </div>
    <div id="mgmt-list" class="mgmt-list"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════
     CUSTOMER PAY TERMINAL VIEW
══════════════════════════════════════════════════ -->
<div id="view-pay-terminal" class="view" style="display:none">
  <div class="panel pay-panel">
    <div class="panel-header">
      <div class="panel-title"><svg class="fad" aria-hidden="true"><use href="#duotone-receipt"></use></svg> PAY FOR ORDER</div>
      <div class="btn-icon-sm-wrap"><button class="btn-icon-sm btn-close-x" onclick="closeUI()"><svg class="fad" aria-hidden="true"><use href="#duotone-xmark"></use></svg></button></div>
    </div>
    <div id="pay-terminal-body" class="pay-terminal-body">
      <div class="empty"><span>🧾</span><p>No pending order</p></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════
     CUSTOMER MENU BOARD VIEW
══════════════════════════════════════════════════ -->
<div id="view-menu" class="view" style="display:none">
  <div class="panel menu-panel">
    <div class="panel-header">
      <div class="panel-header-left">
        <div class="panel-title"><svg class="fad" aria-hidden="true"><use href="#duotone-utensils"></use></svg> <span id="menu-biz-name"></span></div>
        <div class="panel-sub">Browse our menu</div>
      </div>
      <div class="btn-icon-sm-wrap"><button class="btn-icon-sm btn-close-x" onclick="closeUI()"><svg class="fad" aria-hidden="true"><use href="#duotone-xmark"></use></svg></button></div>
    </div>
    <div id="menu-grid" class="menu-grid"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════
     BUNDLE CREATE / EDIT MODAL
══════════════════════════════════════════════════ -->
<div id="bundle-modal-overlay" class="overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div id="bundle-modal-title" class="modal-title"><svg class="fad" aria-hidden="true"><use href="#duotone-plus"></use></svg> CREATE BUNDLE</div>
      <div class="btn-icon-sm-wrap"><button class="btn-icon-sm btn-close-x" onclick="Management.closeModal()"><svg class="fad" aria-hidden="true"><use href="#duotone-xmark"></use></svg></button></div>
    </div>
    <div class="modal-body">
      <input type="hidden" id="bundle-edit-id">
      <div class="form-row">
        <label class="form-label">Bundle Name</label>
        <input id="b-name" class="inp" type="text" placeholder="e.g. Starter Pack">
      </div>
      <div class="form-row">
        <label class="form-label">Description</label>
        <textarea id="b-desc" class="inp inp-ta" placeholder="Describe this bundle…"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">Bundle Image</label>
        <div id="b-icon-picker" class="icon-picker-grid"></div>
        <input type="hidden" id="b-icon" value="">
      </div>
      <div class="form-row">
        <label class="form-label">Price ($)</label>
        <input id="b-price" class="inp" type="number" min="0" placeholder="0">
      </div>
      <div id="b-items-section" class="form-row">
        <label class="form-label">Items & Quantities</label>
        <div id="b-items-picker" class="items-picker"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="Management.closeModal()">Cancel</button>
      <button class="btn-primary" onclick="Management.saveBundle()"><svg class="fad" aria-hidden="true"><use href="#duotone-floppy-disk"></use></svg> Save Bundle</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="js/app.js"></script>
</body>
</html>

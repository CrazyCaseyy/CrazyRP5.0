<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="./logo192.png" />
    <style>
        @font-face {
            font-family: 'Geom Graphic W03';
            src: url('./fonts/GeomGraphic.woff2') format('woff2');
            font-weight: 400;
            font-style: normal
        }

        /* Recolor the tachometer arc (built on MUI CircularProgress) from red to blue,
           without touching the obfuscated bundle - the color is set inline via SVG stroke
           at render time, so this needs !important to win over it. */
        .MuiCircularProgress-root,
        .MuiCircularProgress-svg,
        .MuiCircularProgress-circle {
            color: #1573ed !important;
            stroke: #1573ed !important;
        }

        /* Belt-and-suspenders for elements that re-render very frequently (e.g. the compass
           heading dot, updated on every degree of movement) - theme-scrubber.js can lose a
           timing race against React repeatedly re-applying its own inline style, but a CSS
           rule with !important is re-evaluated by the browser on every repaint, no race at all. */
        [style*="218,27,50"],
        [style*="218, 27, 50"] {
            box-shadow: 0 0 8px rgba(21, 115, 237, 0.9) !important;
            filter: drop-shadow(0 0 8px rgba(21, 115, 237, 0.9)) !important;
        }
        [style*="239,22,22"],
        [style*="239, 22, 22"] {
            color: #1573ed !important;
        }
        [style*="#da1b32"] {
            background: #1573ed !important;
            border-color: #1573ed !important;
        }
        [stroke="#da1b32"] {
            stroke: #1573ed !important;
        }
        [fill="#da1b32"] {
            fill: #1573ed !important;
        }

        /* The low-fuel warning arc keeps its original #da1b32 red as a genuine danger
           indicator (see theme-scrubber.js's isFuelWarningArc exclusion, same radius-136
           fingerprint) - this needs a MORE SPECIFIC selector than the generic
           [stroke="#da1b32"] rule above to win, since CSS resolves ties between two
           !important rules by specificity first, not just source order. */
        path[stroke="#da1b32"][d*="136 136"] {
            stroke: #da1b32 !important;
        }

        /* Prestige's own compass heading diamond has a red glow baked into the obfuscated
           bundle that we've never been able to fully recolor (see the "&::after"-style
           attempts above) - so instead of fighting it, hide it completely and draw our own
           simple diamond in its place, same technique as the ox_target eye reticle. */
        [style*="rotate(45deg)"] {
            display: none !important;
        }

        #crazy-compass-dot {
            display: none;
            position: fixed;
            top: 2.9vh;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: #1573ed;
            box-shadow: 0 0 6px rgba(21, 115, 237, 0.8);
            transform: translateX(-50%) rotate(45deg);
            z-index: 9999;
            pointer-events: none;
        }

        /* Engine start prompt - shown in the driver seat while the engine is off. Badge-style
           key indicator + short label, matching the reference (colored key badge, terse
           action text) rather than a full "Press X to..." sentence. */
        #crazy-engine-prompt {
            display: none;
            position: fixed;
            bottom: 6vh;
            left: 50%;
            transform: translateX(-50%);
            align-items: center;
            gap: 11px;
            background: rgba(20, 20, 23, 0.85);
            border: 1px solid rgba(140, 140, 150, 0.55);
            border-radius: 6px;
            padding: 6px 17px 6px 6px;
            font-family: 'Geom Graphic W03', sans-serif;
            white-space: nowrap;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.05), inset 0 0 12px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.35);
            z-index: 9999;
            pointer-events: none;
        }

        #crazy-engine-prompt .crazy-key-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 31px;
            padding: 7px 12px;
            background: #1573ed;
            color: #ffffff;
            font-weight: 700;
            font-size: 18px;
            line-height: 1;
            border-radius: 5px;
            border: 1px solid rgba(90, 170, 255, 0.75);
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12), 0 0 5px rgba(21, 115, 237, 0.3);
        }

        #crazy-engine-prompt .crazy-prompt-label {
            color: #ffffff;
            font-size: 17px;
            font-weight: 500;
        }

        /* Mic icon turns yellow while the player is actually talking (VOICESTATE
           from crazy-hud's own updateVoiceState broadcast). This is not something
           the bundle does on its own - verified live (a local static server +
           the bundle's built-in "Test Voice HUD" state randomizer) that this
           element's color never changes by itself, only a pulse animation
           toggles. Scoped with :has() to the exact badge containing the mic
           icon's <use> reference, so it can't bleed onto the health/hunger/
           thirst badges, which share the same ring/badge markup and would
           otherwise also match a broader selector. */
        body.crazy-mic-talking .MuiBox-root.css-1ez54hz:has(use[href="#duotone-microphone"]) svg.fad {
            color: #fbf12b !important;
        }

        body.crazy-mic-talking .MuiBox-root.css-1ez54hz:has(use[href="#duotone-microphone"]) use[href="#hexProgressPath"]:last-of-type {
            stroke: #fbf12b !important;
        }
    </style>
    <title>React App</title>
    <script defer="defer" src="./static/js/main.19930c47.js?cb=6"></script>
    <link href="./static/css/main.13e6b553.css?cb=2" rel="stylesheet">
</head>

<body><noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="crazy-compass-dot"></div>
    <div id="crazy-engine-prompt">
        <span class="crazy-key-badge" id="crazy-engine-key"></span>
        <span class="crazy-prompt-label">Start Engine</span>
    </div>
    <script>
        window.addEventListener("message", function (event) {
            if (!event.data) return;

            if (event.data.action === "setVisible" && event.data.data && event.data.data.resource === "VEHICLEHUDVISABLE") {
                var dot = document.getElementById("crazy-compass-dot");
                if (dot) dot.style.display = event.data.data.state ? "block" : "none";
            }

            if (event.data.action === "updateVoiceState") {
                var talking = !!(event.data.data && event.data.data.VOICESTATE);
                document.body.classList.toggle("crazy-mic-talking", talking);
            }

            if (event.data.action === "engineStartPrompt") {
                var box = document.getElementById("crazy-engine-prompt");
                var keyEl = document.getElementById("crazy-engine-key");
                if (box) {
                    if (event.data.show) {
                        if (keyEl) keyEl.textContent = event.data.key || "?";
                        box.style.display = "flex";
                    } else {
                        box.style.display = "none";
                    }
                }
            }
        });
    </script>
    <script src="./theme-scrubber.js?cb=4"></script>
    <script>fetch("./sprites/duotone.svg").then((e => e.text())).then((e => { var t = document.createElement("div"); t.innerHTML = e; var n = t.querySelector("svg"); if (n) { for (var d = 0; d < n.children.length; d++) { var r = n.children[d]; r.id && (r.id = "duotone-" + r.id) } n.style.display = "none", document.body.insertBefore(n, document.body.firstChild) } }))</script>
</body>

</html>

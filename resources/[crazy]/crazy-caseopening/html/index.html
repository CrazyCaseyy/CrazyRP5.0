<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>crazy-caseopening</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <div id="app" class="hidden">
    <div class="box">
      <div class="box-header">
        <div class="box-title">Case Opening</div>
        <div class="box-subtitle">Crack it open</div>
      </div>

      <div class="reel-viewport">
        <div class="reel-pointer"></div>
        <div class="reel-track" id="reel-track"></div>
        <div class="reel-fade reel-fade-left"></div>
        <div class="reel-fade reel-fade-right"></div>
      </div>

      <div class="idle-state" id="idle-state">
        <div class="idle-text">Opening case...</div>
      </div>

      <div class="result-panel hidden" id="result-panel">
        <div class="result-rarity" id="result-rarity"></div>
        <div class="result-icon" id="result-icon"></div>
        <div class="result-label" id="result-label"></div>
        <div class="result-value" id="result-value"></div>
        <button class="result-close" id="btn-close">Claim</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=1"></script>
</body>
</html>

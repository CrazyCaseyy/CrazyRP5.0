<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>crazy-dailytasks</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <div id="app" class="hidden">
    <div class="box">
      <button class="box-close" id="btn-close" aria-label="Close">&times;</button>

      <div class="box-header">
        <div class="box-header-row">
          <div>
            <div class="box-title">Daily Tasks</div>
            <div class="box-subtitle">Lawyer's Office</div>
          </div>
          <button class="cityhall-btn" id="btn-cityhall">
            <svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            City Hall
          </button>
        </div>
        <div class="box-note">Completed tasks pay out at City Hall - not automatically.</div>
      </div>

      <div class="task-list" id="task-list"></div>
    </div>
  </div>

  <script src="script.js?v=1"></script>
</body>
</html>

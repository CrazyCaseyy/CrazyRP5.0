<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>crazy-minigames</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <!-- Handcuffs -->
  <div id="handcuff-app" class="hidden">
    <div class="bar-label" id="handcuff-label">HANDCUFFING</div>
    <div class="bar-track" id="handcuff-track">
      <div class="bar-zone" id="handcuff-zone-0"><span class="bar-zone-label">E</span></div>
      <div class="bar-zone" id="handcuff-zone-1"><span class="bar-zone-label">E</span></div>
      <div class="bar-zone" id="handcuff-zone-2"><span class="bar-zone-label">E</span></div>
      <div class="bar-marker" id="handcuff-marker"></div>
    </div>
  </div>

  <!-- Add future minigames' markup here, each in its own top-level
       #<name>-app container, alongside a matching block in script.js. -->

  <script src="script.js?v=1"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>crazy-minigames Preview</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <div id="handcuff-app" class="hidden">
    <div class="bar-label" id="handcuff-label">HANDCUFFING</div>
    <div class="bar-track" id="handcuff-track">
      <div class="bar-zone" id="handcuff-zone-0"></div>
      <div class="bar-zone" id="handcuff-zone-1"></div>
      <div class="bar-zone" id="handcuff-zone-2"></div>
      <div class="bar-marker" id="handcuff-marker"></div>
    </div>
  </div>

  <script src="script.js?v=1"></script>
  <script>
    // Preview-only: fakes the NUI messages the Lua backend would normally
    // send, so this can be opened directly in a browser to check the
    // styling/flow. Not used in-game - the real index.html has no data
    // injection at all.
    const DURATION = 4000;
    const ZONES = [
      { min: 25, max: 35 },
      { min: 45, max: 60 },
      { min: 70, max: 90 },
    ];

    setTimeout(() => {
      window.postMessage({ game: 'handcuffs', action: 'start', duration: DURATION, zones: ZONES }, '*');
    }, 500);

    ZONES.forEach((zone, i) => {
      const mid = (zone.min + zone.max) / 2;
      setTimeout(() => {
        window.postMessage({ game: 'handcuffs', action: 'hitZone', index: i + 1 }, '*');
      }, 500 + (mid / 100) * DURATION);
    });

    setTimeout(() => {
      window.postMessage({ game: 'handcuffs', action: 'success' }, '*');
    }, 500 + DURATION * 0.92);

    setTimeout(() => {
      window.postMessage({ game: 'handcuffs', action: 'hide' }, '*');
    }, 500 + DURATION * 0.92 + 1500);
  </script>
</body>
</html>

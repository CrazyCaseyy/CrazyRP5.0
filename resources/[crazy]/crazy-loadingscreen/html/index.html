<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crazy RP</title>
    <link href="./style.css" rel="stylesheet" />
</head>

<body>
    <video id="bg-video" autoplay muted loop playsinline src="./loading.mp4"></video>
    <div class="gradient-overlay"></div>

        </div>

    <script src="./app.js"></script>
</body>

</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>crazy-multichar</title>
  <link rel="stylesheet" href="style.css?v=22" />
</head>
<body>
  <div id="app" class="hidden">
    <!-- Character dossier — shown for the currently-focused slot when it
         holds an existing character. Doubles as the top-left title now
         that there's no separate topbar. -->
    <div class="info-panel hidden" id="info-panel">
      <div class="info-header">
        <div class="info-title-row">
          <div class="info-title" id="info-name">—</div>
          <div class="info-gender-icon" id="info-gender-icon"></div>
        </div>
        <div class="info-subtitle" id="info-subtitle">CHARACTER 1 / 3</div>
      </div>
      <div class="info-grid" id="info-grid"></div>
    </div>

    <!-- Shown instead of info-panel when the focused slot has no character
         yet. -->
    <div class="empty-panel hidden" id="empty-panel">
      <div class="empty-title" id="empty-title">SLOT 01</div>
      <div class="empty-sub">No character here yet.</div>
    </div>

    <div class="toast hidden" id="toast"></div>

    <div class="dock hidden" id="dock">
      <button class="dock-btn primary" id="btn-select">ENTER CITY</button>
      <button class="dock-btn danger hidden" id="btn-delete">DELETE</button>
    </div>

    <!-- Focus switcher — one number per slot, always visible. Clicking a
         number just focuses/previews that slot; it doesn't act on it. -->
    <div class="slot-switcher" id="slot-switcher"></div>

    <!-- New character identity form -->
    <div class="modal hidden" id="modal-identity">
      <div class="modal-panel">
        <div class="modal-step" id="step-identity">
          <div class="modal-title">NEW IDENTITY // STEP 1 OF 2</div>

          <label class="field-label">First name</label>
          <input class="field-input" id="input-first-name" maxlength="24" autocomplete="off" />

          <label class="field-label">Last name</label>
          <input class="field-input" id="input-last-name" maxlength="24" autocomplete="off" />

          <label class="field-label">Date of birth</label>
          <input class="field-input" id="input-birthdate" type="date" />

          <label class="field-label">Nationality</label>
          <input class="field-input" id="input-nationality" maxlength="32" autocomplete="off" />

          <label class="field-label">Gender</label>
          <div class="gender-row">
            <button class="gender-btn active" id="btn-gender-male" data-gender="0">MALE</button>
            <button class="gender-btn" id="btn-gender-female" data-gender="1">FEMALE</button>
          </div>

          <div class="modal-actions">
            <button class="dock-btn ghost" id="btn-identity-cancel">CANCEL</button>
            <button class="dock-btn primary" id="btn-identity-next">NEXT</button>
          </div>
        </div>

        <div class="modal-step hidden" id="step-apartment">
          <div class="modal-title">STARTING LOCATION // STEP 2 OF 2</div>

          <div class="apartment-list" id="apartment-list"></div>

          <div class="modal-actions">
            <button class="dock-btn ghost" id="btn-apartment-back">BACK</button>
            <button class="dock-btn primary" id="btn-apartment-confirm" disabled>MOVE IN</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete confirmation -->
    <div class="modal hidden" id="modal-delete">
      <div class="modal-panel modal-panel-small">
        <div class="modal-title danger">DELETE CHARACTER</div>
        <p class="confirm-text">
          Permanently delete <span id="delete-char-name"></span>? This cannot be undone.
        </p>
        <label class="field-label">Type CONFIRM to continue</label>
        <input class="field-input" id="input-delete-confirm" autocomplete="off" />
        <div class="modal-actions">
          <button class="dock-btn ghost" id="btn-delete-cancel">CANCEL</button>
          <button class="dock-btn danger" id="btn-delete-confirm" disabled>DELETE</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Spawn location picker (existing characters) - a sibling of #app, not a
       child: it needs to stay visible after client.lua closes #app and tears
       down the character-select scene, right before the player actually
       spawns in. Deliberately NOT using .modal's full-screen dark scrim
       here - client.lua fades back in on a real hovering camera over the
       chosen location, and darkening the whole screen would hide it. -->
  <div class="spawn-screen hidden" id="modal-spawn">
    <div class="spawn-title"><span class="brand-mark">◆</span> WHERE TO?</div>

    <div class="spawn-panel">
      <div class="spawn-list" id="spawn-list"></div>

      <button class="dock-btn primary spawn-confirm" id="btn-spawn-confirm" disabled>SPAWN IN</button>
    </div>
  </div>

  <script src="script.js?v=12"></script>
</body>
</html>
